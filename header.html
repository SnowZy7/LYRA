<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header - LYRA</title>
    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <header class="header-fixed">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <!-- Logo -->
                <a class="navbar-brand" href="#">
                    <img src="assets/svg/Logo.svg" alt="LYRA Logo" class="logo-img">
                </a>

                <!-- Barre de recherche -->
                <div class="search-container d-none d-md-flex">
                    <input type="text" class="form-control search-input" placeholder="Rechercher...">
                    <img src="assets/svg/Search loupe.svg" alt="Recherche" class="search-icon">
                </div>

                <!-- Photo de profil avec menu -->
                <div class="profile-menu-container">
                    <button class="btn profile-btn" id="profileBtn" type="button">
                        <img src="assets/img/pikachu.jpg" alt="Profil" class="profile-img">
                    </button>
                    
                    <!-- Menu déroulant -->
                    <div class="menu-dropdown" id="menuDropdown">
                        <div class="menu-wrapper">
                            <!-- Contenu du menu -->
                            <div class="menu-items">
                                <a href="#" class="menu-item">
                                    <img src="assets/svg/changer-de-compte.svg" alt="Changer de compte">
                                    <span>Changer de compte</span>
                                </a>
                                <a href="#" class="menu-item menu-item-deco">
                                    <img src="assets/svg/déco.svg" alt="Déconnexion">
                                    <span>Déconnexion</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="javascript/header.js"></script>
</body>
</html>
